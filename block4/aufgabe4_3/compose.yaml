services:
  frontend:
    build:
      context: frontend
      target: development
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - frontend-net
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: backend
      target: development
    container_name: backend
    environment:
      - MONGODB_URI=mongodb://mongo:27017/TodoApp
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:8.3.4
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-net
    restart: always

networks:
  frontend-net:
  backend-net:

volumes:
  mongo-data:
